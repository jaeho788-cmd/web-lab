<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>나의 첫 웹 페이지</title>
    <style>
        /* 깔끔한 화면을 위한 간단한 CSS 스타일 */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            line-height: 1.6;
            margin: 0;
            padding: 0;
            background-color: #f4f7f6;
            color: #333;
        }
        header {
            background-color: #2c3e50;
            color: white;
            text-align: center;
            padding: 2rem 1rem;
        }
        main {
            max-width: 800px;
            margin: 2rem auto;
            padding: 0 1rem;
        }
        .card {
            background: white;
            padding: 1.5rem;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            margin-bottom: 1.5rem;
        }
        button {
            background-color: #3498db;
            color: white;
            border: none;
            padding: 0.5rem 1rem;
            font-size: 1rem;
            border-radius: 4px;
            cursor: pointer;
        }
        button:hover {
            background-color: #2980b9;
        }
        footer {
            text-align: center;
            padding: 1rem;
            background-color: #2c3e50;
            color: white;
            font-size: 0.9rem;
            position: fixed;
            bottom: 0;
            width: 100%;
        }
    </style>
</head>
<body>

    <header>
        <h1>안녕하세요! 방문을 환영합니다 👋</h1>
        <p>HTML, CSS, JavaScript로 만든 기본 템플릿입니다.</p>
    </header>

    <main>
        <div class="card">
            <h2>소개</h2>
            <p>이 웹 페이지는 브라우저에서 바로 실행 가능한 표준 소스코드입니다. 디자인을 바꾸고 싶다면 상단의 <code>&lt;style&gt;</code> 태그 안의 내용을 수정해보세요.</p>
        </div>

        <div class="card">
            <h2>동적 기능 테스트</h2>
            <p>아래 버튼을 누르면 자바스크립트(JavaScript)가 동작합니다.</p>
            <button onclick="greetUser()">인사말 보기</button>
        </div>
    </main>

    <footer>
        <p>&copy; 2026 나의 웹사이트. All rights reserved.</p>
    </footer>

    <script>
        // 간단한 알림창을 띄우는 자바스크립트 함수
        function greetUser() {
            alert('반갑습니다! 멋진 웹 페이지를 만들어보세요!');
        }
    </script>

</body>
</html>
